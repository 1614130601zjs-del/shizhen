<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#f6f1eb"><title>拾帧素材库</title>
<style>
:root{color-scheme:light;--ink:#302b29;--muted:#817773;--paper:#f6f1eb;--card:#fffdfa;--line:#e5dcd4;--accent:#a66d63}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,-apple-system,"PingFang SC",sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 44px}.hero{padding:18px 4px 22px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:700}.hero h1{font-size:27px;margin:7px 0}.hero p,.muted{color:var(--muted);line-height:1.6;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.panel h2{font-size:16px;margin:0 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.file-button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 13px;color:var(--ink);font:inherit}
input[type=file]{display:none}.status{padding:10px 12px;border-radius:10px;background:#f0e9e2;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.list{display:grid;gap:8px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border:1px solid var(--line);border-radius:10px}.item strong{font-size:13px;overflow-wrap:anywhere}.item small{display:block;color:var(--muted);margin-top:3px}.empty{color:var(--muted);font-size:13px;padding:12px 0}
</style></head><body><main>
<header class="hero"><div class="eyebrow">SHIZHEN · LOCAL VAULT</div><h1>拾帧素材库</h1><p>酒馆之外的本地素材主仓库。素材保存在手机本地；酒馆清理不会影响这里的备份。</p></header>
<section class="panel"><h2>素材库位置</h2><div id="folderStatus" class="status">当前使用 App 私有存储。可在顶部选择一个手机文件夹作为长期素材库。</div><p class="muted">建议选择手机内部存储中专门的「拾帧素材库」文件夹。App 不会主动删除其中的文件。</p></section>
<section class="panel"><h2>导入备份文件</h2><p class="muted">第一阶段支持把导出的素材文件放入本地仓库；后续将接入酒馆端扫描和一键恢复。</p><div class="actions"><label class="file-button" for="files">选择文件</label><input id="files" type="file" multiple><button id="refresh">刷新素材清单</button></div><div id="importStatus" class="status" style="margin-top:10px">尚未导入文件</div></section>
<section class="panel"><h2>本地素材</h2><div id="fileList" class="list"><div class="empty">正在读取本地素材库…</div></div></section>
</main><script src="app.js"></script></body></html>
